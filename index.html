    var m = ln.match(/^\s*([^:：]{1,10})[:：]\s*(.+?)\s*$/);
    if (!m) return '<div class="bk"><span class="v">' + esc(ln.trim()) + '</span></div>';
    var k = m[1], v = m[2], cv = /帳號/.test(k) ? v.replace(/[^\d]/g, '') : /戶名/.test(k) ? v : '';
    return '<div class="bk"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span>' + (cv ? '<button type="button" class="cp" data-a="cp" data-v="' + esc(cv) + '">複製</button>' : '') + '</div>';
  }).join('');
}
function l5Form(o, btn, cls) {
  return '<form id="rf" class="l5f" novalidate data-id="' + esc(o.id) + '"><label>匯款帳號後五碼<input name="l5" required inputmode="numeric" maxlength="5" minlength="5" pattern="\\d{5}" autocomplete="off" placeholder="00000" value="' + esc(o.last5) + '"></label><button class="btn ' + cls + '">' + btn + '</button></form><p id="re" class="tg" role="alert" style="margin:4px 0 0"></p>';
}
function memAct(o) {
  if (o.pay === '刷卡' && o.st === '待刷卡')
    return o.link ? '<p><a class="btn a" style="display:inline-block;text-decoration:none;line-height:28px" href="' + esc(o.link) + '" target="_blank" rel="noopener">前往刷卡付款</a></p>'
                  : '<p class="tg">付款連結準備好後會通知你,也可以稍後回到這裡查看。</p>';
  if (o.pay === '匯款' && o.st === '已匯款待查帳')
    return '<p class="tg">已收到你回報的匯款後五碼 <b>' + esc(o.last5) + '</b>,我們查帳確認後會安排出貨。</p><p class="ds" style="max-height:none;margin-bottom:0">後五碼打錯了?可重新回報:</p>' + l5Form(o, '更新', 'l');
  if (o.pay === '匯款' && o.st === '待匯款')
    return '<div class="bkc"><div class="am">請匯款 <b>' + money(o.total) + '</b> 至下列帳戶</div>' + bankHtml(MD.bank) + '</div>' +
      (o.last5 ? '<p class="tg" style="margin:4px 0">已回報後五碼 ' + esc(o.last5) + ',等待我們核對。</p>' : '') + l5Form(o, '回報已匯款', 'a');
  if (o.pay === '付現金' && o.st === '待自取') return '<p class="ds">請到店自取並當面付現金,商品可以取貨時我們會再通知你。</p>';
  if (o.pay === '賣貨便' && o.st === '待出貨') return '<p class="ds">我們會安排賣貨便出貨,出貨後這裡會更新物流資訊。</p>';
  if (/待出貨/.test(o.st)) return '<p class="ds">已收到款項,我們會盡快安排出貨。</p>';
  if (o.st === '已退回') return '<p class="ds">這張出貨單因為太久沒取貨已退回,如果還需要請聯繫我們重新安排出貨。</p>';
  if (/待送達|待收貨/.test(o.st)) return '<p class="ds">包裹已寄出,物流資訊請看下方。</p>';
  return '';
}
function shipPo(s) {
  var rows = String(s.it || '').split('、').filter(Boolean).map(function (x) { var i = x.lastIndexOf('×'); return i > 0 ? [x.slice(0, i), x.slice(i + 1)] : [x, '']; });
  return '<div class="po"><div class="pot">' + esc(D.store || 'coscos韓國選物店') + '</div><h3>訂 購 單</h3><p class="pon">' + esc(s.id) + (s.cr ? ' · ' + esc(String(s.cr).slice(0, 10)) : '') + '</p>' +
    '<table><thead><tr><th>品名</th><th class="n">數量</th></tr></thead><tbody>' + rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="n">' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>' +
    '<div class="pof">商品 ' + money(s.sub) + (s.disc ? '<br>優惠折抵 -' + money(s.disc) : '') + (s.cred ? '<br>購物金折抵 -' + money(s.cred) : '') + '<br>運費 ' + (s.fee ? money(s.fee) : '免運') + '<br><b>應付 ' + money(s.total) + '</b></div>' +
    '<div class="prc">收件資訊:' + esc(s.ship) + '<br>電話:' + esc(s.phone) + (s.note ? '<br>備註:' + esc(s.note) : '') + '</div></div>';
}
function shipDetail(s) {
  var h = '<h2>' + esc(s.id) + '</h2><span class="chip">' + esc(s.st) + '</span>' + steps(s) + memAct(s) + shipPo(s);
  if (s.co || s.no) h += '<p style="margin-top:10px">物流:<b>' + esc(s.co) + '</b>' + (s.no ? ' 單號 <b>' + esc(s.no) + '</b> <button type="button" class="cp" data-a="cp" data-v="' + esc(s.no) + '">複製</button>' : '') + (s.at ? '<br><small>出貨時間 ' + esc(s.at) + '</small>' : '') + '</p>' + (s.trk ? '<p><a class="btn l" style="display:inline-block;text-decoration:none;line-height:26px" href="' + esc(s.trk) + '" target="_blank" rel="noopener">查詢物流動態</a></p>' : '');
  return h + '<p><button class="btn l" data-a="mb">返回</button> <button class="btn l" data-a="x">關閉</button></p>';
}

    '<div id="sq" class="ds" style="margin-top:8px">計算金額中…</div></div>' +
    '<form id="sf"><fieldset><legend>配送方式</legend><label><input type="radio" name="method" value="店到店" checked> 店到店 ' + money(MD.feeCvs) + '</label><label><input type="radio" name="method" value="宅配"> 宅配 ' + money(MD.fee) + '</label><label><input type="radio" name="method" value="自取"> 自取(免運)</label>' + (MD.free ? '<small class="ds">滿 ' + money(MD.free) + ' 免運</small>' : '') + '</fieldset>' +
    '<label>收件人姓名<input name="rname" required maxlength="30" value="' + esc((MD.me && MD.me.pname) || o0.nm || '') + '"></label>' +
    '<label>聯絡電話<input name="phone" required inputmode="tel" value="' + esc((MD.me && MD.me.phone) || o0.ph || '') + '"></label>' +
    '<div id="mcvs"><label>超商<select name="cvs"><option>7-11</option><option>全家</option></select></label><label>取貨門市(店名或店號)<input name="store" maxlength="60"></label></div>' +
    '<div id="mhome" hidden><label>收件地址<input name="addr" maxlength="150" value="' + esc((MD.me && MD.me.addr) || '') + '"></label></div>' +
    (bal > 0 ? '<label>使用購物金(餘額 ' + money(bal) + ')<input name="credit" type="number" min="0" step="1" value="0" inputmode="numeric"></label><small class="ds" id="crh"></small>' + credNote() : '') +
    '<fieldset><legend>付款方式</legend><label><input type="radio" name="pay" value="匯款" checked> 匯款(先轉帳,確認收款後出貨)</label><label><input type="radio" name="pay" value="賣貨便"> 賣貨便(貨到付款,僅店到店)</label><label><input type="radio" name="pay" value="付現金"> 付現金(僅自取)</label><label style="color:var(--mute)"><input type="radio" name="pay" value="刷卡" disabled> 信用卡(籌備中)</label></fieldset>' +
    '<label>備註<textarea name="note" rows="2" maxlength="200"></textarea></label>' +
    '<p id="sfe" class="tg" role="alert"></p><button class="btn a">確認出貨</button> <button type="button" class="btn l" data-a="mb">返回</button></form>';
}
function sfState(ch) {
  var f = $('#sf'); if (!f) return {};
  if (ch === 'method') { if (f.method.value !== '自取' && f.pay.value === '付現金') f.pay.value = '匯款'; if (f.method.value === '自取' && f.pay.value === '賣貨便') f.pay.value = '匯款'; }
  else if (ch === 'pay') { if (f.pay.value === '賣貨便') f.method.value = '店到店'; else if (f.pay.value === '付現金') f.method.value = '自取'; }
  var cv = f.method.value === '店到店', hm = f.method.value === '宅配';
  $('#mcvs').hidden = !cv; $('#mhome').hidden = !hm;
  f.store.required = cv; f.addr.required = hm;
  return { method: f.method.value, credit: f.credit ? Number(f.credit.value) || 0 : 0 };
}
var SQT = 0;
function sfQuote(ch) {
  var st = sfState(ch), items = Object.keys(MSEL).map(function (k) { return { oid: k.split('|')[0], pid: k.split('|')[1] }; });
  clearTimeout(SQT);
  SQT = setTimeout(function () {
    google.script.run.withSuccessHandler(function (q) {
      if (!$('#sq')) return;
      $('#sq').innerHTML = q.ok ? '商品合計 ' + money(q.sub) + (q.disc ? '<br>優惠折抵 -' + money(q.disc) : '') + (q.cred ? '<br>購物金折抵 -' + money(q.cred) : '') + '<br>運費 ' + (q.fee ? money(q.fee) : '免運') + '<br><b>應付 ' + money(q.total) + '</b>' : esc(q.msg);
      if (q.ok && $('#crh')) $('#crh').textContent = q.allowed > 0 ? '這張出貨單最多可用 ' + money(q.allowed) + '(超過會自動以上限計算)' : (q.balance > 0 ? '商品金額滿 ' + money(q.minSpend) + ' 才能使用購物金' : '');
    }).memberShipQuote(mt, items, st);
  }, 250);
}
document.addEventListener('input', function (e) { if (e.target.form && e.target.form.id === 'sf' && (e.target.name === 'credit')) sfQuote(); });
document.addEventListener('change', function (e) { if (e.target.form && e.target.form.id === 'sf' && (e.target.name === 'method' || e.target.name === 'pay')) sfQuote(e.target.name); });
function memLoad(cb) {
  google.script.run.withSuccessHandler(function (d) { MD = d; cb(); })
    .withFailureHandler(function (e) { if (mt === LT) { LT = ''; try { localStorage.removeItem('lt'); } catch (x) {} } mt = ''; show(memLogin()); if ($('#me')) $('#me').textContent = e.message; }).memberOrders(mt);
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return;
  var a = b.dataset.a;
  if (a === 'mem') { if (mt) memLoad(function () { show(memList()); }); else show(memLogin()); }
  else if (a === 'memgo') { mt = b.dataset.t; memLoad(function () { show(memList()); }); }
  else if (a === 'sd') { e.preventDefault(); var s = MD.ships.filter(function (z) { return z.id === b.dataset.id; })[0]; if (s) show(shipDetail(s)); }
  else if (a === 'mb') show(memList());
  else if (a === 'mt') { MTAB = b.dataset.t; show(memList()); }
  else if (a === 'sgo') { show(shipForm()); sfQuote(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target;
  if (f.id === 'mf' || f.id === 'rf' || f.id === 'pf') e.preventDefault();
  if (f.id === 'pf') {
    $('#pfe').textContent = '儲存中…';
    google.script.run.withSuccessHandler(function (me) { MD.me = me; $('#pfe').textContent = '已儲存 ✓'; }).withFailureHandler(function (er) { $('#pfe').textContent = er.message; }).memberSaveProfile(mt, { name: f.name.value, phone: f.phone.value, email: f.email.value, addr: f.addr.value });
    return;
  }
  if (f.id === 'mf') {
    $('#me').textContent = '';
    google.script.run.withSuccessHandler(function (r) {
      if (!r.ok) { $('#me').textContent = r.msg; return; }
      mt = r.token; memLoad(function () { show(memList()); });
    }).withFailureHandler(function (er) { $('#me').textContent = er.message; }).memberLogin(f.phone.value, f.oid.value);
  } else if (f.id === 'rf') {
    $('#re').textContent = ''; var id = f.dataset.id;
    if (!/^\d{5}$/.test(f.l5.value.trim())) { $('#re').textContent = '請輸入 5 位數字(匯款帳號後五碼)'; return; }
    google.script.run.withSuccessHandler(function (d) {
      MD = d; show(shipDetail(d.ships.filter(function (z) { return z.id === id; })[0]));
    }).withFailureHandler(function (er) { $('#re').textContent = er.message; }).memberReportPay(mt, id, f.l5.value);
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return;
  if (b.dataset.a === 'cp') {
    var v = b.dataset.v || '', ok = function () { b.textContent = '已複製'; b.classList.add('ok'); setTimeout(function () { b.textContent = '複製'; b.classList.remove('ok'); }, 1500); };
    var fb = function () { var t = document.createElement('textarea'); t.value = v; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (x) {} document.body.removeChild(t); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, fb); else fb();
  } else if (b.dataset.a === 'lgd') goLogin();
  else if (b.dataset.a === 'lo') show('<h2>確定要登出嗎?</h2><p class="ds">登出後將無法使用會員優惠與購物金,可隨時再用 LINE 登入。</p><p><button class="btn l" data-a="x">取消</button> <button class="btn a" data-a="lo2">確定登出</button></p>');
  else if (b.dataset.a === 'lo2') { LT = ''; mt = ''; MD = null; MSEL = {}; MTAB = 'o'; QT = null; useCr = false; try { localStorage.removeItem('lt'); } catch (x) {} $('#dlg').close(); setLg(); }
});
document.addEventListener('click', function (e) {
  var tr = e.target.closest && e.target.closest('.li.pk'); if (!tr || e.target.closest('a,input,button')) return;

document.addEventListener('change', function (e) {

  if (n) n.innerHTML = !v ? '請選擇規格查看剩餘數量' : (q == null ? (cur.stock === null ? '庫存充足' : '剩餘數量:<b>' + cur.stock + '</b> 件') : q === 0 ? '此規格已售完' : '剩餘數量:<b>' + q + '</b> 件');
});
document.addEventListener('input', function (e) { if (e.target.name === 'l5') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5); });
document.addEventListener('change', function (e) { if (e.target.id === 'ucr') { useCr = e.target.checked; refreshQuote(); } });
document.addEventListener('submit', function (e) {
  var f = e.target; if (f.id !== 'sf') return; e.preventDefault();

  $('#sfe').textContent = '';
  google.script.run.withSuccessHandler(function (d) { MD = d; MSEL = {}; MTAB = 's'; show(shipDetail(d.ships.filter(function (z) { return z.id === d.sid; })[0])); })
    .withFailureHandler(function (er) { $('#sfe').textContent = er.message; }).memberCreateShip(mt, items, { pay: f.pay.value, method: f.method.value, rname: f.rname.value, cvs: f.cvs.value, store: f.store.value, addr: f.addr.value, credit: f.credit ? Number(f.credit.value) || 0 : 0, note: f.note.value, phone: f.phone.value });
});

/* LIFF:從 LINE 內開啟網站時自動登入(只需按一次「允許」) */
function liffBoot() {
  var id = D && D.line && D.line.liff; if (!id || LT || window.__liff) return; window.__liff = 1;
  var sc = document.createElement('script'); sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  sc.onload = function () {
    liff.init({ liffId: id }).then(function () {
      if (!liff.isLoggedIn()) { if (liff.isInClient() || /[?&]liff\.state|liff\.line\.me/.test(location.href + document.referrer)) liff.login(); return; }
      var it = liff.getIDToken(); if (!it) { liff.logout(); liff.login(); return; }
      google.script.run.withSuccessHandler(function (r) {
        LT = r.token; mt = LT; try { localStorage.setItem('lt', LT); sessionStorage.removeItem('liffRetry'); } catch (e) {}
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        setLg(); memLoad(function () { setLg(); });
      }).withFailureHandler(function (e) {
        var tried = ''; try { tried = sessionStorage.getItem('liffRetry') || ''; sessionStorage.setItem('liffRetry', '1'); } catch (x) {}
        if (!tried) { try { liff.logout(); } catch (x) {} liff.login(); return; }
        $('#notice').hidden = false; $('#notice').textContent = e.message || 'LINE 登入失敗';
      }).lineLiff(it, liff.getAccessToken());
    }).catch(function () {});
  };
  document.head.appendChild(sc);
}
