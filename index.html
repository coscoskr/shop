.bd{color:var(--acc)}

.bk{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed var(--pink);font-size:14px}.bk .k{flex:none;width:3.2em;color:var(--mute);font-size:13px}.bk .v{flex:1;min-width:0;font-weight:700;word-break:break-all;letter-spacing:.3px}
