<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#4B3B37;--mute:#8C7771;--line:#F0DFD9;--acc:#A95B4D;--soft:#FAEEEA;--pink:#E8AEA0;--ok:#2F7D5B}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:6px 14px;border-radius:2px;cursor:pointer}
.btn.l{background:none;color:var(--ink)}.btn.a{background:var(--acc);border-color:var(--acc)}
.btn.s{padding:2px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:6px 10px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;background:var(--soft)}
#side b{padding:0 8px 16px;font-size:16px}
#side .tab{text-align:left;border:0;border-left:3px solid transparent;padding:10px 12px;font-size:15px}
#side .tab.on{border-left-color:var(--acc);background:#fff;font-weight:700}
#side #out{margin-top:auto}
.w{padding:24px 32px;overflow-x:auto;min-width:0}
.fb{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.fb label{margin:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.fb input,.fb select{width:auto;min-width:120px}
.sum{margin-left:auto;color:var(--mute)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:#fff;z-index:1}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:var(--soft)}
input:not([type=checkbox]),select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:#fff}
#lg{max-width:320px;margin:15vh auto;padding:16px}
label{display:block;margin:10px 0;font-size:13px}
label>select,label>textarea,label>input:not([type=checkbox]):not([type=radio]){margin-top:5px}
input[type=checkbox],input[type=radio]{margin:0 7px 0 0;vertical-align:middle}
th,td{line-height:1.6}
.bt{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.bt label{white-space:nowrap;display:flex!important;flex-direction:row;align-items:center;gap:6px;margin:0}.px{max-width:900px;margin-bottom:20px}.px h3{margin:0 0 8px}.px .oc{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;background:#fff;cursor:pointer;font:inherit;color:inherit}.px button.oc:hover{background:var(--soft)}.px .n{text-align:right}.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}.sm>div{background:var(--soft);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}.sm .m{font-size:12px}.sm b{font-size:16px}.sm .tt{color:var(--acc);font-size:18px}
.ic{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0;background:#fff}.ic label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);margin:0}.ic input,.ic select{width:100%!important;height:36px;padding:0 10px;font-size:14px;box-sizing:border-box;color:var(--ink)}.ic output{display:flex;align-items:center;height:36px;font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ic .r1{display:grid;grid-template-columns:3fr 1fr;gap:12px;margin-bottom:12px}.ic .r2,.ic .r3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:12px}.ic .r3{margin-bottom:0}.ic .sv{display:flex;align-items:flex-end}.ic .sv .btn{width:100%;height:36px;padding:0 12px}
@media(max-width:700px){.ic .r1{grid-template-columns:1fr}}
.sht{min-width:1080px}.sht th,.sht td{vertical-align:middle;padding:10px 10px}.sht th{font-size:13px;color:var(--mute);font-weight:500}.sht .c{text-align:center}.sht .n{text-align:right;font-variant-numeric:tabular-nums}.sht td.it{white-space:normal;min-width:200px;max-width:300px;font-size:13px}.sht td b{font-variant-numeric:tabular-nums}.sht small{font-size:12px}.sht tbody tr{cursor:pointer}.sht tbody tr:hover{background:var(--soft)}
.ln td select{margin:0}
.bt .btn,p>.btn{margin-right:4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 22px}.g .f{grid-column:1/-1}
.ck label{display:inline-block;margin-right:10px}
dialog{border:0;border-radius:2px;padding:24px;width:min(1500px,98vw);max-height:96vh;overflow:auto;color:var(--ink)}
#dq{width:min(460px,92vw);padding:20px}
#dq::backdrop{background:rgba(42,31,37,.6)}
#busy{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(42,31,37,.35)}#busy.on{display:flex}#busy div{background:#fff;color:var(--ink);padding:18px 28px;border-radius:4px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}.rp div{background:var(--soft);padding:12px;border-radius:4px}.rp b{display:block;font-size:20px;margin-top:4px}
@media print{#app,#lg,#dq,#busy,.noprint{display:none!important}body{background:#fff}dialog{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:100%!important;max-height:none!important;overflow:visible!important;padding:0!important}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}}
dialog::backdrop{background:rgba(42,31,37,.5)}
dialog h3{margin:0 0 10px}dialog h4{margin:18px 0 6px}
.er{color:var(--acc)}.m{color:var(--mute)}
fieldset{border:1px solid var(--line);border-radius:2px;margin:14px 0;padding:10px 14px}
.chip{display:inline-block;border-radius:12px;padding:0 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--acc)}
.chip.d{background:#E6F2EC;color:var(--ok)}
.bt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.ln td input{width:90px}
.warn{background:#FFF6E5;border:1px solid #F1D9A5;padding:8px 12px;margin:8px 0;border-radius:2px;white-space:pre-wrap}
.itm{width:100%;table-layout:fixed}.itm th,.itm td{padding:4px 3px;font-size:13px;vertical-align:middle}.itm input,.itm select{width:100%;min-width:0;padding:4px;font-size:13px;box-sizing:border-box}.itm th:nth-child(1){width:15%}.itm th:nth-child(2),.itm th:nth-child(6){width:7%}.itm th:nth-child(3),.itm th:nth-child(4),.itm th:nth-child(5),.itm th:nth-child(10){width:5.5%}.itm th:nth-child(7){width:10%}.itm th:nth-child(8),.itm th:nth-child(11){width:9%}.itm th:nth-child(9){width:6.5%}.itm th:nth-child(12){width:7%}.itm th:nth-child(13){width:5%}
.ig{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.ig .it{width:96px;text-align:center;font-size:12px}.ig img{width:96px;height:96px;object-fit:cover;border:1px solid var(--line)}
</style>
</head>

  <p class="er" id="le" role="alert"></p><button class="btn a">登入</button></form>

function shrink(file) {

    rd.onload = function () { im.onload = function () {

    rd.readAsDataURL(file);

}

function drawCodes() {
  var cur = CD.filter(function (x) { return x.code === CDE; })[0] || { code: '', type: '百分比', value: '', note: '', on: true, limit: '', start: '', end: '' };
  $('#v').innerHTML = '<h2 style="margin-top:0">折扣碼</h2><p class="m">客人在前台購物車輸入折扣碼就能折抵(遊客也可用)。每個折扣碼擇一:折百分比,或折固定金額;大小寫不分。和會員、活動優惠不疊加,系統自動取最划算的一個。</p>' +
    '<form id="cdf" style="max-width:760px;border:1px solid var(--line);padding:12px;border-radius:4px"><h3 style="margin:0 0 8px">' + (CDE ? '編輯折扣碼:' + esc(CDE) : '新增折扣碼') + '</h3><div class="g">' +
    fld('折扣碼名稱(客人要輸入的文字)', 'code', cur.code) +
    '<label>折扣方式<select name="type" id="cdt"><option' + (cur.type === '百分比' ? ' selected' : '') + '>百分比</option><option' + (cur.type === '金額' ? ' selected' : '') + '>金額</option></select></label>' +
    '<label><span id="cdl">' + (cur.type === '金額' ? '折扣金額(元)' : '折扣 %(例:10 = 折抵 10%,打九折)') + '</span><input name="value" type="number" min="1" step="1" value="' + esc(cur.value) + '" inputmode="numeric"></label>' +
    '<label>使用數量上限(選填,空白=不限)<input name="limit" type="number" min="1" step="1" inputmode="numeric" value="' + (cur.limit || '') + '"></label>' +
    '<label>開始日(選填)<input name="start" type="date" value="' + esc(cur.start || '') + '"></label>' +
    '<label>截止日(選填,當天可用到 23:59)<input name="end" type="date" value="' + esc(cur.end || '') + '"></label>' +
    fld('備註(選填,只有你看得到)', 'note', cur.note) + '</div>' +
    '<label class="ck"><input type="checkbox" name="on"' + (cur.on ? ' checked' : '') + '> 啟用</label><p class="er" id="cde" role="alert"></p><button class="btn a">' + (CDE ? '儲存' : '新增') + '</button>' + (CDE ? ' <button type="button" class="btn l" data-cd="cancel">取消編輯</button>' : '') + '</form>' +
    '<table style="margin-top:16px"><thead><tr><th>折扣碼</th><th>內容</th><th>狀態</th><th>已使用</th><th>使用期限</th><th>備註</th><th></th></tr></thead><tbody>' +
    (CD.map(function (x) { return '<tr><td><b>' + esc(x.code) + '</b></td><td>' + (x.type === '百分比' ? '折 ' + x.value + '%' : '折 ' + money(x.value)) + '</td><td>' + (x.state === '可用' ? '<span class="chip d">可使用</span>' : '<span class="chip">' + esc(x.state) + '</span>') + '</td><td>' + x.used + (x.limit ? ' / ' + x.limit : '') + ' 次</td><td>' + (x.start || x.end ? esc((x.start || '') + ' ~ ' + (x.end || '不限')) : '不限') + '</td><td style="white-space:normal">' + esc(x.note) + '</td><td style="white-space:nowrap"><button class="btn l s" data-cd="edit" data-c="' + esc(x.code) + '">編輯</button> <button class="btn l s" data-cd="tog" data-c="' + esc(x.code) + '">' + (x.on ? '停用' : '啟用') + '</button> <button class="btn l s" data-cd="del" data-c="' + esc(x.code) + '">刪除</button></td></tr>'; }).join('') || '<tr><td colspan="7" class="m">還沒有折扣碼</td></tr>') + '</tbody></table>';
}
document.addEventListener('change', function (e) { if (e.target.id === 'cdt') $('#cdl').textContent = e.target.value === '金額' ? '折扣金額(元)' : '折扣 %(例:10 = 折抵 10%,打九折)'; });
document.addEventListener('submit', function (e) {
  var f = e.target; if (f.id !== 'cdf') return; e.preventDefault();
  call('adminSaveCode', T, { old: CDE, code: f.code.value, type: f.type.value, value: f.value.value, note: f.note.value, limit: f.limit.value, start: f.start.value, end: f.end.value, on: f.on.checked }).then(function (r) { CD = r; CDE = ''; drawCodes(); }).catch(fail('#cde'));
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-cd]'); if (!b) return;
  var c = b.dataset.c, t = b.dataset.cd;
  if (t === 'edit') { CDE = c; drawCodes(); window.scrollTo(0, 0); }
  else if (t === 'cancel') { CDE = ''; drawCodes(); }
  else if (t === 'tog') { var on = !(CD.filter(function (x) { return x.code === c; })[0] || {}).on; call('adminSetCodeOn', T, c, on).then(function (r) { CD = r; drawCodes(); }).catch(function (er) { tell(er.message); }); }
  else if (t === 'del') ask('刪除折扣碼「' + c + '」?已經下的訂單不受影響。', function () { call('adminDeleteCode', T, c).then(function (r) { CD = r; if (CDE === c) CDE = ''; drawCodes(); }).catch(function (er) { tell(er.message); }); });
});
var PIMG = [];
function pimBox() { return '<div style="margin:8px 0"><div class="m">匯款截圖/單據(最多 8 張)</div><div id="pimgs"></div><input type="file" id="pvimf" accept="image/*" multiple> <span class="m" id="pims"></span></div>'; }
function pimDraw() {
  var box = $('#pimgs'); if (!box) return;
  box.innerHTML = PIMG.map(function (u, k) { return '<span style="display:inline-block;margin:0 8px 8px 0;text-align:center"><img src="' + esc(u) + '" alt="" style="height:70px;display:block"><button type="button" class="btn l s" data-pv="pimrm" data-i="' + k + '">移除</button></span>'; }).join('') || '<span class="m">還沒有圖片</span>';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-pv="pimrm"]'); if (!b) return;
  PIMG.splice(Number(b.dataset.i), 1); pimDraw();
});
document.addEventListener('change', function (e) {
  if (e.target.id !== 'pvimf' || !e.target.files.length) return;
  var files = [].slice.call(e.target.files), st = $('#pims'), k = 0;
  e.target.value = '';
  (function next() {
    if (k >= files.length) { st.textContent = '上傳完成'; return; }
    if (PIMG.length >= 8) { st.textContent = '最多 8 張'; return; }
    st.textContent = '上傳中 ' + (k + 1) + '/' + files.length + '…';
    shrink(files[k]).then(function (b64) { return call('adminUploadImage', T, files[k].name, 'image/jpeg', b64); })
      .then(function (u) { PIMG.push(u); pimDraw(); k++; next(); })
      .catch(function (er) { st.textContent = er.message; });
  })();
});
/* ---------- 訂購單 ---------- */
function poHtml(sid) {
  var x = shipList().filter(function (y) { return y.s.id === sid; })[0]; if (!x) return '';
  var s = x.s, items = [];
  O.forEach(function (o) { o.items.forEach(function (i) { if (i.sid === sid) items.push(i); }); });
  return '<div class="pg" style="font-size:14px;padding:6px 2px 18px"><h2 style="margin:0 0 4px;text-align:center">訂 購 單</h2><p style="text-align:center;margin:0 0 12px" class="m">coscos韓國選物店 · 出貨單 ' + esc(s.id) + '</p>' +
    '<table style="min-width:0;width:100%;margin-bottom:10px"><tbody><tr><td style="width:90px">收件人</td><td>' + esc(s.name) + '</td><td style="width:90px">電話</td><td>' + esc(s.phone) + '</td></tr>' +
    '<tr><td>配送/收件</td><td colspan="3" style="white-space:normal">' + esc(s.ship) + '</td></tr><tr><td>付款方式</td><td>' + esc(s.pay) + (s.last5 ? ' (後五碼 ' + esc(s.last5) + ')' : '') + '</td><td>建立時間</td><td>' + esc(s.cr.slice(0, 16)) + '</td></tr>' +
    '<tr><td>訂單</td><td colspan="3">' + esc(s.oids.join('、')) + '</td></tr></tbody></table>' +
    '<table style="min-width:0;width:100%"><thead><tr><th>品名</th><th>規格</th><th style="text-align:right">數量</th><th style="text-align:right">單價</th><th style="text-align:right">小計</th><th>檢貨</th></tr></thead><tbody>' +
    items.map(function (i) { return '<tr><td style="white-space:normal">' + esc(i.name) + '</td><td>' + esc(i.spec) + '</td><td style="text-align:right">' + i.qty + '</td><td style="text-align:right">' + i.unit + '</td><td style="text-align:right">' + i.sub + '</td><td>☐</td></tr>'; }).join('') + '</tbody></table>' +
    '<table style="min-width:0;width:260px;margin:10px 0 0 auto"><tbody><tr><td>商品合計</td><td style="text-align:right">' + money(s.sub) + '</td></tr>' + (s.disc ? '<tr><td>優惠</td><td style="text-align:right">-' + money(s.disc) + '</td></tr>' : '') + (s.cred ? '<tr><td>購物金</td><td style="text-align:right">-' + money(s.cred) + '</td></tr>' : '') +
    '<tr><td>運費</td><td style="text-align:right">' + money(s.fee) + '</td></tr><tr><td><b>應付</b></td><td style="text-align:right"><b>' + money(s.total) + '</b></td></tr></tbody></table>' +
    (s.note ? '<p>備註:' + esc(s.note) + '</p>' : '') + '</div>';
}
function openPO(sids) {
  var d = $('#dlg'), h = sids.map(poHtml).join('');
  if (!h) return;
  d.innerHTML = '<div id="po">' + h + '</div><p class="noprint" style="margin-top:14px"><button class="btn a" data-a="poprint">列印(' + sids.length + ' 張)</button> ' + (sids.length === 1 ? '<button class="btn l" data-a="ship" data-id="' + esc(sids[0]) + '">返回出貨單</button> ' : '') + '<button class="btn l" data-a="x">關閉</button></p>';
  if (!d.open) d.showModal();
}

/* ---------- 報表 ---------- */
var RF = { oFrom: '', oTo: '', sFrom: '', sTo: '', status: '', pay: '', q: '' }, RD = null;
function reportPage() {
  $('#v').innerHTML = '<h2 style="margin-top:0">報表</h2><div class="fb" id="rpf"><label>訂貨日期從<input type="date" data-r="oFrom" value="' + esc(RF.oFrom) + '"></label><label>到<input type="date" data-r="oTo" value="' + esc(RF.oTo) + '"></label>' +
    '<label>出貨日期從<input type="date" data-r="sFrom" value="' + esc(RF.sFrom) + '"></label><label>到<input type="date" data-r="sTo" value="' + esc(RF.sTo) + '"></label>' +
    '<label>結帳狀態<select data-r="status" id="rst"><option value="">全部</option></select></label><label>付款方式<select data-r="pay">' + opts(['匯款', '賣貨便', '刷卡'], RF.pay, '全部') + '</select></label>' +
    '<label>關鍵字<input data-r="q" value="' + esc(RF.q) + '" placeholder="訂單、姓名、品名"></label><button class="btn l" data-rp="clr">清除</button></div><div id="rpb"><p class="m">載入中…</p></div>';
  loadReport();
}
function loadReport() {
  call('adminReport', T, RF).then(function (r) {
    RD = r; var st = $('#rst'); if (st) st.innerHTML = '<option value="">全部</option>' + r.statuses.map(function (x) { return '<option' + (x === RF.status ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    var m = r.sum;
    $('#rpb').innerHTML = '<div class="rp"><div>總營收(商品小計)<b>' + money(m.revenue) + '</b></div><div>利潤<b>' + money(m.profit) + '</b></div><div>銷售數量<b>' + m.qty + '</b></div><div>下單筆數<b>' + m.orders + '</b></div><div>出貨單數<b>' + m.ships + '</b></div><div>成本<b>' + money(m.cost) + '</b></div></div>' +
      '<p class="m">營收為商品小計(未扣優惠、購物金,未含運費);' + (m.noCost ? m.noCost + ' 項未填成本,未計入成本與利潤。' : '') + '出貨日期篩選只會包含已建立出貨單的品項。</p>' +
      '<table><thead><tr><th>商品</th><th>數量</th><th>營收</th><th>成本</th><th>利潤</th></tr></thead><tbody>' + (r.prods.map(function (p) { return '<tr><td style="white-space:normal">' + esc(p.name) + '</td><td>' + p.qty + '</td><td>' + p.revenue + '</td><td>' + p.cost + '</td><td>' + p.profit + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="m">沒有資料</td></tr>') + '</tbody></table>';
  }).catch(function (e) { $('#rpb').innerHTML = '<p class="er">' + esc(e.message) + '</p>'; });
}
document.addEventListener('change', function (e) { var k = e.target.dataset && e.target.dataset.r; if (!k || !e.target.closest('#rpf')) return; RF[k] = e.target.value; loadReport(); });
document.addEventListener('click', function (e) { if (e.target.dataset && e.target.dataset.rp === 'clr') { RF = { oFrom: '', oTo: '', sFrom: '', sTo: '', status: '', pay: '', q: '' }; reportPage(); } });

/* ---------- 庫存表 ---------- */
var SK = null;
function stockPage() {
  $('#v').innerHTML = '<p class="m">載入中…</p>';
  call('adminStockView', T).then(function (d) { SK = d; VL = d.vlist || VL; drawStock(); }).catch(function (e) { $('#v').innerHTML = '<p class="er">' + esc(e.message) + '</p>'; });
}
function drawStock() {
  var P2 = SK.products;
  $('#v').innerHTML = '<h2 style="margin-top:0">庫存表</h2><p class="m">一批貨到了,一部分是客人訂的、一部分是要放庫存:客訂在「訂單明細」,庫存部分在這裡新增「庫存進貨」。兩種都會出現在「訂單明細」(庫存的訂購人顯示【庫存】),可以一起勾選做廠商付款。庫存進貨改成「已到貨」時才會增加商品數量。</p>' +
    '<table><thead><tr><th>商品</th><th>型態</th><th>目前數量</th><th>待到貨(客訂)</th><th>待到貨(庫存進貨)</th><th>預設廠商</th><th>成本</th></tr></thead><tbody>' +
    P2.map(function (p) { return '<tr><td style="white-space:normal">' + esc(p.name) + ' <span class="m">' + esc(p.id) + '</span></td><td>' + esc(p.type) + '</td><td>' + (p.stock === '' ? '無限' : p.stock) + '</td><td>' + p.waitOrders + '</td><td>' + p.waitStock + '</td><td>' + esc(p.vendor) + '</td><td>' + (p.cost === '' ? '' : p.cost) + '</td></tr>'; }).join('') + '</tbody></table>' +
    '<h3 style="margin-top:22px">新增庫存進貨</h3><form id="skf" style="max-width:760px"><div class="g"><label>商品<select name="pid" id="skp">' + P2.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select></label>' +
    '<label>規格<select name="spec" id="sks"></select></label>' + fld('數量', 'qty', '', 'number') + '<label>廠商<select name="vendor">' + vopt('', '(用商品預設)') + '</select></label>' + fld('單件成本(空白=用商品預設)', 'cost', '', 'number') + fld('貨源(空白=用商品預設)', 'src', '') + '</div>' +
    '<label class="ck"><input type="checkbox" name="arrived"> 已到貨(直接增加商品數量)</label><p class="er" id="ske" role="alert"></p><button class="btn a">新增</button></form>' +
    '<h3 style="margin-top:22px">庫存進貨紀錄</h3><table><thead><tr><th>編號</th><th>日期</th><th>商品</th><th>規格</th><th>數量</th><th>狀態</th><th>廠商</th><th>成本</th><th></th></tr></thead><tbody>' +
    (SK.ins.map(function (l) { return '<tr><td>' + esc(l.id) + '</td><td>' + esc(l.at) + '</td><td style="white-space:normal">' + esc(l.name) + '</td><td>' + esc(l.spec) + '</td><td>' + l.qty + '</td><td>' + esc(l.arr) + '</td><td>' + esc(l.vendor) + '</td><td>' + l.cost + '</td><td><button class="btn l s" data-sk="del" data-id="' + esc(l.id) + '">刪除</button></td></tr>'; }).join('') || '<tr><td colspan="9" class="m">還沒有庫存進貨</td></tr>') + '</tbody></table><p class="m">到貨狀態、廠商、成本請到「訂單明細」勾選後用「批次修改」;付款也在那邊一起做。</p>';
  skSpecs();
}
function skSpecs() {
  var p = SK.products.filter(function (x) { return x.id === $('#skp').value; })[0], el = $('#sks'); if (!el) return;
  el.innerHTML = p && p.specs.length ? p.specs.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') : '<option value="">(無規格)</option>';
}
document.addEventListener('change', function (e) { if (e.target.id === 'skp') skSpecs(); });
document.addEventListener('submit', function (e) {
  var f = e.target; if (f.id !== 'skf') return; e.preventDefault();
  call('adminAddStockIn', T, { pid: f.pid.value, spec: f.spec.value, qty: f.qty.value, vendor: f.vendor.value, cost: f.cost.value, src: f.src.value, arrived: f.arrived.checked }).then(function (d) { SK = d; PVDIRTY = true; P = null; drawStock(); refreshProducts(); }).catch(fail('#ske'));
});
function refreshProducts() { call('adminInit', T).then(function (d) { P = d.products; }).catch(function () {}); }
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-sk="del"]'); if (!b) return;
  ask('刪除庫存進貨 ' + b.dataset.id + '?(若已到貨,會從商品數量扣回)', function () {
    call('adminDeleteStockIn', T, b.dataset.id).then(function (d) { SK = d; PVDIRTY = true; if (tab === 'k') drawStock(); else purchView(); refreshProducts(); }).catch(function (er) { tell(er.message); });
  });
});
</script>
